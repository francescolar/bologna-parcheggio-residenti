plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.laruffa.parresbo'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'dev.laruffa.parresbo'
        minSdk 24
        targetSdk 36   // Google Play (dal 31/08/2026) richiede API 36 per nuove app e aggiornamenti
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'BASE_URL', '"https://parresbo-app.laruffa.dev"'
    }

    buildFeatures {
        buildConfig true
    }

    // Firma di upload per Google Play: le credenziali stanno FUORI dal repo
    // (~/.config/parresbo-signing/signing.properties, oppure il file indicato da PARRESBO_SIGNING).
    def signingFile = file(System.getenv('PARRESBO_SIGNING') ?: "${System.getProperty('user.home')}/.config/parresbo-signing/signing.properties")
    def signing = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false     // codice aperto: l'offuscamento non serve e non è provabile senza un dispositivo
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Auto: app per auto con schermate a modelli (Car App Library)
    implementation 'androidx.car.app:app:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
