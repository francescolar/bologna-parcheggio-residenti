plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.laruffa.parresbo'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.laruffa.parresbo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'BASE_URL', '"https://parresbo-app.laruffa.dev"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Auto: app per auto con schermate a modelli (Car App Library)
    implementation 'androidx.car.app:app:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
