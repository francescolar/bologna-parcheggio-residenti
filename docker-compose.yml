services:
  app:
    build: .
    ports:
      # solo localhost: l'accesso pubblico passa dal reverse proxy (Apache) con HTTPS.
      # Cambiare HOST_PORT se la porta è già occupata sul server.
      - "127.0.0.1:${HOST_PORT:-3100}:3000"
    volumes:
      # persiste la cache Overpass tra i riavvii/deploy (volume gestito da Docker)
      - parresbo-cache:/app/cache
    environment:
      # password per sbloccare la modalità debug (vuota = debug disattivato). Impostarla in Coolify.
      DEBUG_PASSWORD: ${DEBUG_PASSWORD:-}
      OVERPASS_CONTACT: ${OVERPASS_CONTACT:-}
    restart: unless-stopped

volumes:
  parresbo-cache:
