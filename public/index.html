<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>ParResBo – Zone parcheggio residenti Bologna</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="loading">
  <h2>ParResBo</h2>
  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
  <div id="prog-text">Avvio…</div>
</div>

<div id="map"></div>

<div id="legend">
  <h3>Zone parcheggio</h3>
  <div id="legend-items"></div>
</div>

<div id="stats"></div>

<button id="locate-btn" style="display:none">
  <span class="locate-icon">◎</span> Dove sono?
</button>

<div id="locate-result" style="display:none"></div>

<button id="unmatched-btn" style="display:none"></button>

<div id="unmatched-panel" style="display:none">
  <div id="unmatched-header">
    <h3>Strade non trovate su OSM</h3>
    <button id="unmatched-close">✕</button>
  </div>
  <ul id="unmatched-list"></ul>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
