<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="build" content="__BUILD_ID__">
  <meta name="build-time" content="__BUILD_TIME__">
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>ParResBo – Zone parcheggio residenti Bologna</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css?v=__BUILD_ID__">
</head>
<body>

<div id="loading">
  <img src="/icons/logo.svg" alt="" width="160" height="160">
  <h2>ParResBo</h2>
  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
  <div id="prog-text">Avvio…</div>
</div>

<div id="map"></div>

<div id="legend" class="collapsed">
  <button id="legend-toggle" aria-expanded="false">
    <span class="legend-title">Zone</span>
    <span id="legend-summary"></span>
    <span class="legend-chev">▾</span>
  </button>
  <div id="legend-items"></div>
</div>

<button id="locate-btn" style="display:none">
  <span class="locate-icon">◎</span> Posso parcheggiare qui?
</button>

<div id="locate-result" style="display:none"></div>

<div id="verdict" style="display:none"></div>

<button id="settings-fab" aria-label="Impostazioni" style="display:none">⚙</button>

<div id="settings" style="display:none">
  <div class="settings-card">
    <header>
      <h2>Impostazioni</h2>
      <button class="settings-close" id="settings-close" aria-label="Chiudi">✕</button>
    </header>
    <div id="settings-body"></div>
  </div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/geo.js?v=__BUILD_ID__"></script>
<script src="/app.js?v=__BUILD_ID__"></script>
</body>
</html>
